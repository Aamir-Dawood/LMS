<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login - LMS</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title text-center mb-4">LMS Login</h3>

          <div class="mb-3 d-flex justify-content-center">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="toggleRole">
              <label class="form-check-label" for="toggleRole">HR Manager Login</label>
            </div>
          </div>

          <form id="loginForm">
            <div id="alert" style="display:none"></div>
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" id="password" class="form-control" required>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<script>
const apiBase = '/api';
const loginForm = document.getElementById('loginForm');
const toggle = document.getElementById('toggleRole');
const alertBox = document.getElementById('alert');

function showAlert(message, type='danger'){
  alertBox.style.display='block';
  alertBox.className = `alert alert-${type}`;
  alertBox.textContent = message;
}

loginForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  alertBox.style.display='none';
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const isHr = toggle.checked;

  try{
    const resp = await fetch(`${apiBase}/accounts/employees/login/`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await resp.json();
    if(!resp.ok){
      showAlert(data.detail || 'Login failed');
      return;
    }
    // If HR mode is toggled, ensure user is in HR_Managers group
    if(isHr && !(data.groups && data.groups.includes('HR_Managers'))){
      showAlert('This account is not authorized as HR Manager');
      return;
    }

    // Save token to localStorage and redirect based on role
    localStorage.setItem('authToken', data.token);
    if(isHr){
      window.location.href = '/hr_dashboard.html';
    } else {
      window.location.href = '/dashboard.html';
    }
  }catch(err){
    showAlert('Network error');
  }
});
</script>
</body>
</html>
